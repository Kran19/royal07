services:
  # Nginx Reverse Proxy (SSL enabled)
  nginx:
    image: nginx:alpine
    container_name: royalbet_nginx_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro # For Certbot SSL
    depends_on:
      - frontend
      - backend
    networks:
      - royalbet_prod_network

  # Frontend (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
        INTERNAL_BACKEND_URL: ${INTERNAL_BACKEND_URL}
    container_name: royalbet_frontend_prod
    restart: always
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
      INTERNAL_BACKEND_URL: ${INTERNAL_BACKEND_URL}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - royalbet_prod_network

  # Backend API (NestJS)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: royalbet_backend_prod
    expose:
      - "4000"
    restart: always
    # Uncomment deploy block if using Docker Swarm
    # deploy:
    #   replicas: 3
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:-postgresql://royalbet:royalbet_pass@postgres:5432/royalbet?schema=public}
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:-secret-key-royalbet!}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./prod_data/uploads:/app/uploads
    networks:
      - royalbet_prod_network

  # PostgreSQL with TimescaleDB
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: royalbet_postgres_prod
    restart: always
    env_file:
      - .env.prod
    environment:
      POSTGRES_USER: royalbet
      POSTGRES_PASSWORD: ${DB_PASSWORD:-royalbet_pass}
      POSTGRES_DB: royalbet
    ports:
      - "5432:5432"
    volumes:
      - ./prod_data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U royalbet"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - royalbet_prod_network

  # Redis for caching and WebSocket
  redis:
    image: redis:7-alpine
    container_name: royalbet_redis_prod
    restart: always
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - ./prod_data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - royalbet_prod_network


networks:
  royalbet_prod_network:
    driver: bridge
