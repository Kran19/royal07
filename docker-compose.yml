services:
  # PostgreSQL with TimescaleDB
  postgres:
    image: timescale/timescaledb:2.14-pg15
    container_name: royalbet_postgres
    restart: always
    environment:
      POSTGRES_USER: royalbet
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: royalbet
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/prisma/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U royalbet"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - royalbet_network
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

  # Redis for caching and WebSocket
  redis:
    image: redis:7.2-alpine
    container_name: royalbet_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - royalbet_network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # Backend API (NestJS)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: royalbet_backend
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://royalbet:${DB_PASSWORD}@postgres:5432/royalbet
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: https://royalbet.com
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_logs:/app/logs
    networks:
      - royalbet_network
    deploy:
      replicas: 3
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3

  # Frontend (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: royalbet_frontend
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://api.royalbet.com
      NEXT_PUBLIC_WS_URL: wss://api.royalbet.com
      INTERNAL_BACKEND_URL: http://backend:4000
    depends_on:
      - backend
    networks:
      - royalbet_network
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # Nginx Load Balancer
  nginx:
    image: nginx:alpine
    container_name: royalbet_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - backend
      - frontend
    networks:
      - royalbet_network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # Bull Board UI (Queue Monitoring)
  bull-board:
    image: bull-board:latest
    container_name: royalbet_bull_board
    restart: always
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    ports:
      - "4000:4000"
    networks:
      - royalbet_network
    deploy:
      resources:
        limits:
          memory: 256M

  # Prometheus for monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: royalbet_prometheus
    restart: always
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - royalbet_network
    deploy:
      resources:
        limits:
          memory: 512M

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: royalbet_grafana
    restart: always
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - royalbet_network
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  postgres_data:
  redis_data:
  backend_logs:
  prometheus_data:
  grafana_data:

networks:
  royalbet_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
