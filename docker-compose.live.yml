services:
  # PostgreSQL with TimescaleDB
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: royalbet_postgres_live
    restart: always
    env_file:
      - .env.live
    environment:
      POSTGRES_USER: royalbet
      POSTGRES_PASSWORD: ${DB_PASSWORD:-royalbet_pass}
      POSTGRES_DB: royalbet
    volumes:
      - postgres_data_live:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U royalbet"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - royalbet_live_network

  # Redis for caching and WebSocket
  redis:
    image: redis:alpine
    container_name: royalbet_redis_live
    restart: always
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data_live:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - royalbet_live_network

  # Backend API (NestJS)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: royalbet_backend_live
    restart: always
    env_file:
      - .env.live
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:-postgresql://royalbet:royalbet_pass@postgres:5432/royalbet?schema=public}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-secret-key-royalbet!}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads_data_live:/app/uploads
    ports:
      - "4000:4000"
    networks:
      - royalbet_live_network

  # Frontend (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_WS_URL: ${NGROK_BACKEND_WS_URL}
        INTERNAL_BACKEND_URL: http://backend:4000
    container_name: royalbet_frontend_live
    restart: always
    env_file:
      - .env.live
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: /api
      NEXT_PUBLIC_WS_URL: ${NGROK_BACKEND_WS_URL}
      INTERNAL_BACKEND_URL: http://backend:4000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - royalbet_live_network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: royalbet_nginx_live
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # SSL Certificates (managed by Certbot on host)
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    networks:
      - royalbet_live_network

volumes:
  postgres_data_live:
  redis_data_live:
  uploads_data_live:

networks:
  royalbet_live_network:
    driver: bridge
